<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spike S3 — MP3 encoder benchmark</title>
  </head>
  <body>
    <pre id="output">running…</pre>
    <script type="module">
      // The benchmark runs in a real Chromium renderer because
      // `@mediabunny/mp3-encoder` needs the WebCodecs `AudioEncoder` API.
      // The candidate bundles are loaded from the throwaway install through
      // the file:// URL, so the page resolves them as plain ES modules.

      const params = new URLSearchParams(location.search);
      const seconds = Number(params.get('seconds') ?? 300);
      const benchDir = params.get('benchDir') ?? '';
      const rustyWasmUrl = params.get('rustyWasm') ?? '';

      const log = (line) => {
        document.getElementById('output').textContent += `\n${line}`;
      };

      /** Deterministic stereo test signal: chord tones + click + harmonics. */
      function generatePcm(sampleRate) {
        const total = sampleRate * seconds;
        const left = new Float32Array(total);
        const right = new Float32Array(total);
        const base = [220, 261.63, 329.63, 392];
        for (let i = 0; i < total; i += 1) {
          const t = i / sampleRate;
          const clickPhase = t % 0.5;
          const click = clickPhase < 0.02 ? Math.exp(-clickPhase * 350) * 0.6 : 0;
          let l = 0;
          let r = 0;
          for (let n = 0; n < base.length; n += 1) {
            const amp = 0.18 / (n + 1);
            const ph = t * Math.PI * 2 * base[n] * (1 + 0.0007 * n);
            l += amp * Math.sin(ph);
            r += amp * Math.sin(ph + 0.01);
          }
          l += 0.05 * Math.sin(t * Math.PI * 2 * 1760);
          r += 0.05 * Math.sin(t * Math.PI * 2 * 1760);
          const clickSample = click * Math.sin(t * Math.PI * 2 * 4000);
          left[i] = Math.max(-1, Math.min(1, l * 0.6 + clickSample));
          right[i] = Math.max(-1, Math.min(1, r * 0.6 + clickSample));
        }
        return { left, right };
      }

      function interleave({ left, right }) {
        const out = new Float32Array(left.length * 2);
        for (let i = 0; i < left.length; i += 1) {
          out[i * 2] = left[i];
          out[i * 2 + 1] = right[i];
        }
        return out;
      }

      /** Interleaved 16-bit PCM, for the pure-JS encoders that take Int16. */
      function interleaveInt16({ left, right }) {
        const out = new Int16Array(left.length * 2);
        for (let i = 0; i < left.length; i += 1) {
          out[i * 2] = Math.round(Math.max(-1, Math.min(1, left[i])) * 32767);
          out[i * 2 + 1] = Math.round(Math.max(-1, Math.min(1, right[i])) * 32767);
        }
        return out;
      }

      function median(values) {
        const sorted = [...values].sort((a, b) => a - b);
        const mid = sorted.length >> 1;
        return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
      }

      /** SNR against the original, after finding the alignment lag. */
      function quality(reference, decoded) {
        const WINDOW = 4096;
        const MAX_LAG = 4096;
        const probeStart = Math.min(
          (reference.length / 2) | 0,
          reference.length - WINDOW - MAX_LAG,
        );
        let bestLag = 0;
        let bestCorrelation = -Infinity;
        for (let lag = -MAX_LAG; lag <= MAX_LAG; lag += 1) {
          let sum = 0;
          for (let i = 0; i < WINDOW; i += 1) {
            const d = decoded[probeStart + i + lag];
            if (d === undefined) continue;
            sum += reference[probeStart + i] * d;
          }
          if (sum > bestCorrelation) {
            bestCorrelation = sum;
            bestLag = lag;
          }
        }
        let signal = 0;
        let error = 0;
        const start = Math.max(0, -bestLag);
        const end = Math.min(reference.length, decoded.length - bestLag);
        for (let i = start; i < end; i += 1) {
          const s = reference[i];
          const d = decoded[i + bestLag];
          const e = s - d;
          signal += s * s;
          error += e * e;
        }
        return {
          snrDb: error > 0 ? 10 * Math.log10(signal / error) : Infinity,
          alignmentLagSamples: bestLag,
          comparedSamples: end - start,
          decodedSamples: decoded.length,
          referenceSamples: reference.length,
        };
      }

      /** Decode an MP3 with the browser's own decoder (no extra dependency). */
      async function decodeMp3(bytes, sampleRate) {
        // decodeAudioData needs the whole file; the AudioContext resamples to
        // its own rate, so request the file's rate by decoding with an
        // OfflineAudioContext at the target rate.
        const arrayBuffer = bytes.buffer.slice(
          bytes.byteOffset,
          bytes.byteOffset + bytes.byteLength,
        );
        const context = new OfflineAudioContext(2, 1, sampleRate);
        const decoded = await context.decodeAudioData(arrayBuffer);
        const frames = decoded.length;
        const out = new Float32Array(frames * decoded.numberOfChannels);
        // Interleave, to match the reference layout.
        for (let c = 0; c < decoded.numberOfChannels; c += 1) {
          const channel = decoded.getChannelData(c);
          for (let i = 0; i < frames; i += 1) {
            out[i * decoded.numberOfChannels + c] = channel[i];
          }
        }
        return out;
      }

      async function main() {
        const measurements = [];
        const candidates = [];

        // --- @mediabunny/mp3-encoder (MPL-2.0 wrapper around LAME WASM) ---
        try {
          const { mediabunny, registerMp3Encoder } = await import(
            `${benchDir}/browser-bundles/mediabunny.mjs`
          );
          registerMp3Encoder();
          candidates.push({
            id: '@mediabunny/mp3-encoder',
            version: '1.65.2',
            packageLicense: 'MPL-2.0',
            encoderLicense: 'LAME 3.100 WASM — LGPL',
            run: async ({ interleaved, sampleRate, bitrate }) => {
              const channels = 2;
              const frames = interleaved.length / channels;
              const planar = new Float32Array(frames * channels);
              for (let i = 0; i < frames; i += 1) {
                planar[i] = interleaved[i * 2];
                planar[frames + i] = interleaved[i * 2 + 1];
              }
              const sample = new mediabunny.AudioSample({
                format: 'f32-planar',
                data: planar,
                sampleRate,
                numberOfChannels: channels,
                numberOfFrames: frames,
                timestamp: 0,
              });
              const source = new mediabunny.AudioSampleSource({
                codec: 'mp3',
                quality: new mediabunny.Quality({
                  bitrate: bitrate * 1000,
                  bitrateMode: 'constant',
                }),
              });
              const target = new mediabunny.BufferTarget();
              const output = new mediabunny.Output({
                format: new mediabunny.Mp3OutputFormat(),
                target,
              });
              output.addAudioTrack(source);
              const started = output.start();
              await source.add(sample);
              sample.close();
              source.close();
              await output.finalize();
              await started;
              return new Uint8Array(target.buffer);
            },
          });
        } catch (error) {
          candidates.push({
            id: '@mediabunny/mp3-encoder',
            failed: String(error),
          });
        }

        // --- wasm-media-encoders (MIT wrapper around LAME WASM) ---
        try {
          const { createMp3Encoder } = await import(
            `${benchDir}/browser-bundles/wasm-media-encoders.mjs`
          );
          candidates.push({
            id: 'wasm-media-encoders',
            version: '0.7.0',
            packageLicense: 'MIT',
            encoderLicense: 'LAME 3.x — LGPL',
            run: async ({ interleaved, sampleRate, bitrate }) => {
              const encoder = await createMp3Encoder();
              encoder.configure({ sampleRate, channels: 2, bitrate });
              const chunk = 1152 * 2;
              const parts = [];
              for (let i = 0; i < interleaved.length; i += chunk) {
                const slice = interleaved.subarray(i, Math.min(i + chunk, interleaved.length));
                const left = new Float32Array(slice.length / 2);
                const right = new Float32Array(slice.length / 2);
                for (let j = 0; j < slice.length / 2; j += 1) {
                  left[j] = slice[j * 2];
                  right[j] = slice[j * 2 + 1];
                }
                parts.push(Uint8Array.from(encoder.encode([left, right])));
              }
              parts.push(Uint8Array.from(encoder.finalize()));
              const total = parts.reduce((n, p) => n + p.length, 0);
              const out = new Uint8Array(total);
              let off = 0;
              for (const p of parts) {
                out.set(p, off);
                off += p.length;
              }
              return out;
            },
          });
        } catch (error) {
          candidates.push({
            id: 'wasm-media-encoders',
            failed: String(error),
          });
        }

        // --- @breezystack/lamejs (pure JS LAME port, LGPL-3.0) ---
        try {
          const lamejs = await import(`${benchDir}/browser-bundles/lamejs.mjs`);
          const Lame = lamejs.default?.Mp3Encoder ? lamejs.default : lamejs;
          candidates.push({
            id: '@breezystack/lamejs',
            version: '1.2.7',
            packageLicense: 'LGPL-3.0',
            encoderLicense: 'LAME 3.x port — LGPL',
            run: async ({ interleavedInt16, sampleRate, bitrate }) => {
              const encoder = new Lame.Mp3Encoder(2, sampleRate, bitrate);
              const parts = [];
              const frame = 1152;
              const left = new Int16Array(frame);
              const right = new Int16Array(frame);
              for (let i = 0; i < interleavedInt16.length; i += frame * 2) {
                const n = Math.min(frame, (interleavedInt16.length - i) / 2);
                for (let j = 0; j < n; j += 1) {
                  left[j] = interleavedInt16[i + j * 2];
                  right[j] = interleavedInt16[i + j * 2 + 1];
                }
                const buf = encoder.encodeBuffer(left.subarray(0, n), right.subarray(0, n));
                if (buf.length > 0) parts.push(Uint8Array.from(buf));
              }
              const tail = encoder.flush();
              if (tail.length > 0) parts.push(Uint8Array.from(tail));
              const total = parts.reduce((n, p) => n + p.length, 0);
              const out = new Uint8Array(total);
              let off = 0;
              for (const p of parts) {
                out.set(p, off);
                off += p.length;
              }
              return out;
            },
          });
        } catch (error) {
          candidates.push({ id: '@breezystack/lamejs', failed: String(error) });
        }

        // --- rusty_mp3 (Apache-2.0, pure Rust) ---
        try {
          const response = await fetch(rustyWasmUrl);
          const wasmBytes = await response.arrayBuffer();
          candidates.push({
            id: 'rusty_mp3 (wasm)',
            version: '1.0.5',
            packageLicense: 'Apache-2.0',
            encoderLicense: 'Apache-2.0 (own implementation, no LAME code)',
            run: async ({ interleaved, sampleRate, bitrate }) => {
              const { instance } = await WebAssembly.instantiate(wasmBytes, {});
              const { memory, encode_mp3, last_output_len, alloc_buffer, free_buffer } =
                instance.exports;
              const pcmBytes = interleaved.length * 4;
              const pcmPtr = alloc_buffer(pcmBytes);
              const pcmView = new Float32Array(memory.buffer, pcmPtr, interleaved.length);
              pcmView.set(interleaved);
              const outPtr = encode_mp3(pcmPtr, interleaved.length, 2, sampleRate, bitrate);
              const len = last_output_len();
              const out = new Uint8Array(memory.buffer, outPtr, len);
              const copy = out.slice();
              free_buffer(pcmPtr, pcmBytes);
              return copy;
            },
          });
        } catch (error) {
          candidates.push({
            id: 'rusty_mp3 (wasm)',
            failed: String(error),
          });
        }

        for (const candidate of candidates) {
          if (candidate.failed) {
            log(`SKIP ${candidate.id}: ${candidate.failed}`);
            measurements.push({
              candidate: candidate.id,
              failed: candidate.failed,
            });
            continue;
          }
          log(`candidate ${candidate.id} ${candidate.version} (${candidate.packageLicense})`);
          for (const sampleRate of [44100, 48000]) {
            const { left, right } = generatePcm(sampleRate);
            const interleaved = interleave({ left, right });
            const interleavedInt16 = interleaveInt16({ left, right });
            for (const bitrate of [128, 192]) {
              const times = [];
              let bytes = 0;
              let mp3 = null;
              try {
                for (let run = 0; run < 3; run += 1) {
                  const t0 = performance.now();
                  const output = await candidate.run({
                    interleaved,
                    interleavedInt16,
                    sampleRate,
                    bitrate,
                  });
                  times.push((performance.now() - t0) / 1000);
                  bytes = output.length;
                  if (run === 0) mp3 = output;
                }
              } catch (error) {
                log(`  ${sampleRate}/${bitrate}: FAILED ${error}`);
                measurements.push({
                  candidate: candidate.id,
                  sampleRate,
                  bitrate,
                  failed: String(error),
                });
                continue;
              }
              let q = null;
              try {
                q = quality(interleaved, await decodeMp3(mp3, sampleRate));
              } catch (error) {
                q = { error: String(error) };
              }
              const medianSeconds = median(times);
              const result = {
                candidate: candidate.id,
                sampleRate,
                bitrate,
                encodeSecondsMedian: medianSeconds,
                encodeSecondsMin: Math.min(...times),
                encodeSecondsMax: Math.max(...times),
                runs: times.map((t) => Number(t.toFixed(4))),
                realTimeFactor: Number((seconds / medianSeconds).toFixed(2)),
                mp3Bytes: bytes,
                bytesPerSecond: Number((bytes / seconds).toFixed(1)),
                quality: q,
              };
              measurements.push(result);
              log(
                `  ${sampleRate}/${bitrate}: ${medianSeconds.toFixed(3)}s ` +
                  `(${result.realTimeFactor}x), ${bytes} bytes, SNR ${
                    q?.snrDb !== undefined ? q.snrDb.toFixed(2) : 'n/a'
                  } dB`,
              );
            }
          }
        }

        return { measurements };
      }

      window.__runBenchmark = async () => {
        try {
          return await main();
        } catch (error) {
          return { error: String(error), stack: error?.stack };
        }
      };
    </script>
  </body>
</html>

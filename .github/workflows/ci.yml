name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '12.9.1'
  NODE_VERSION: '24'

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit and component tests
        run: pnpm run test

      # Testing.md §10: the core layer is gated at 90% lines and 85% branches,
      # so the threshold is enforced on every OS in the matrix, not only
      # locally.
      - name: Core coverage gate
        run: pnpm run test:coverage

      # A run of the theory core's public API: scale generation, degree
      # resolution, voicing, hints and fretboard positions.
      - name: Theory core smoke run
        run: pnpm run test:smoke

      - name: Build
        run: pnpm run build

      - name: Electron smoke test
        run: pnpm exec playwright test

      - name: Dependency audit
        run: pnpm run audit:deps

      - name: Licence audit
        run: pnpm run audit:licenses

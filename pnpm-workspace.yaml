minimumReleaseAgeExclude:
  - electron@45.2.2
  - spessasynth_core@4.4.5 || 4.4.6
  - spessasynth_lib@4.4.3 || 4.4.4

# pnpm 12 requires every dependency with an install script to be reviewed.
# electron downloads its platform binary; esbuild installs its native binary.
allowBuilds:
  electron: true
  esbuild: true
  # Spike S2 native MIDI candidate. The published tarball ships prebuilt
  # Node-API binaries; the install script verifies them and only falls back
  # to node-gyp when no prebuild matches the platform.
  '@julusian/midi': true
  # Spike S4 packaging harness. electron-winstaller's install script copies the
  # host-architecture 7-Zip binary it vendors into the package (MIT). The
  # spike builds an NSIS installer, not a Squirrel one, so the script's
  # output is never used; pnpm still requires the allowlist entry because the
  # dependency is installed.
  electron-winstaller: true

# minimatch <11.0.1 is affected by a glob-parts amplification advisory
# (GHSA-1244012). The patched release is API-compatible for our usage.
overrides:
  minimatch: 11.0.1
